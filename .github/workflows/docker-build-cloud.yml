name: Docker Build Cloud - ARM64

on:
  push:
    branches: [backend-only]
  workflow_dispatch:
    inputs:
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        default: "docker/Dockerfile"
        type: string
      use_build_cloud:
        description: "Use Docker Build Cloud"
        required: false
        default: true
        type: boolean

env:
  # Registry configuration
  DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG || secrets.DOCKERHUB_ORG || 'flowiseai' }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'flowiseai' }}

  # Docker Build Cloud configuration
  DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT || 'flowiseai' }}
  CLOUD_BUILDER_NAME: ${{ vars.CLOUD_BUILDER_NAME || 'flowiseai-builder' }}
  USE_BUILD_CLOUD: ${{ github.event_name == 'workflow_dispatch' && inputs.use_build_cloud == false && 'false' || 'true' }}

  # Base image versions for cache consistency
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  ALPINE_VERSION: ${{ vars.ALPINE_VERSION || '20' }}

  # Build configuration
  DOCKERFILE_PATH: ${{ inputs.dockerfile_path || 'docker/Dockerfile' }}
  TARGET_PLATFORM: linux/arm64

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate image metadata
        id: meta
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Determine environment and tags based on branch
          if [[ "$BRANCH_NAME" == "main" ]]; then
            ENVIRONMENT="production"
            TAG_SUFFIX="latest-arm64"
            IMAGE_DESC="Production ARM64 Flowise AI application"
          else
            ENVIRONMENT="development"
            TAG_SUFFIX="dev-arm64"
            IMAGE_DESC="Development ARM64 Flowise AI application"
          fi

          # Generate multiple tags: one with commit SHA, one as the branch latest
          TAGS="${{ env.DOCKERHUB_ORG }}/${REPO_NAME}:${TAG_SUFFIX}-${SHORT_SHA},${{ env.DOCKERHUB_ORG }}/${REPO_NAME}:${TAG_SUFFIX}"

          echo "image-name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "tag-suffix=${TAG_SUFFIX}" >> $GITHUB_OUTPUT
          echo "description=${IMAGE_DESC}" >> $GITHUB_OUTPUT

          echo "🏗️ Environment: ${ENVIRONMENT}"
          echo "📦 Tags: ${TAGS}"
          echo "🔧 Base: node:${NODE_VERSION}-alpine"

      - name: Validate Dockerfile
        run: |
          if [[ ! -f "${{ env.DOCKERFILE_PATH }}" ]]; then
            echo "❌ Dockerfile not found: ${{ env.DOCKERFILE_PATH }}"
            ls -la docker/ 2>/dev/null || echo "Directory not found: docker/"
            exit 1
          fi
          echo "✅ Using Dockerfile: ${{ env.DOCKERFILE_PATH }}"

      - name: Determine build mode
        id: setup
        run: |
          if [[ "${{ env.USE_BUILD_CLOUD }}" == "true" ]]; then
            echo "mode=cloud" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.DOCKER_ACCOUNT }}/${{ env.CLOUD_BUILDER_NAME }}" >> $GITHUB_OUTPUT
            echo "🚀 Using Docker Build Cloud"
            echo "   Builder: cloud-${{ env.DOCKER_ACCOUNT }}-${{ env.CLOUD_BUILDER_NAME }}"
            echo "   Performance: Native ARM64, 16 vCPUs, 32GB RAM"
          else
            echo "mode=local" >> $GITHUB_OUTPUT
            echo "endpoint=" >> $GITHUB_OUTPUT
            echo "⚠️ Using local QEMU emulation (slower)"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.setup.outputs.mode == 'local'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ steps.setup.outputs.mode == 'cloud' && 'cloud' || 'docker-container' }}
          endpoint: ${{ steps.setup.outputs.mode == 'cloud' && steps.setup.outputs.endpoint || '' }}
          install: true

      - name: Verify builder configuration
        run: |
          echo "🔍 Build configuration:"
          docker buildx ls
          if [[ "${{ steps.setup.outputs.mode }}" == "cloud" ]]; then
            echo "✅ Docker Build Cloud: ${{ steps.setup.outputs.endpoint }}"
            echo "   Native ARM64 builds (up to 10x faster)"
          else
            echo "⚠️ Local QEMU emulation"
          fi

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            BUILD_VERSION=${{ steps.meta.outputs.short-sha }}
            PROJECT_NAME=${{ steps.meta.outputs.image-name }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.image-name }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short-sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=SEE LICENSE IN LICENSE.md
            flowise.project.type=nodejs
            flowise.build.environment=${{ steps.meta.outputs.environment }}
            flowise.build.platform=arm64
            flowise.build.optimized=true
            flowise.base.node_version=${{ env.NODE_VERSION }}
            flowise.base.alpine_version=${{ env.ALPINE_VERSION }}

      - name: Build Summary
        run: |
          echo "## 🎉 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.meta.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** \`${{ env.DOCKERFILE_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ env.TARGET_PLATFORM }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Mode:** ${{ steps.setup.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | ${{ env.DOCKERHUB_ORG }}/${{ steps.meta.outputs.image-name }} | \`${{ steps.meta.outputs.tag-suffix }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Metadata" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version:** \`${{ env.NODE_VERSION }}\`" >> $GITHUB_STEP_SUMMARY# trigger
